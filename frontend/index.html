<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Controlled Record System — Gujarat Print Pack Publications Pvt Ltd</title>
    <meta name="description" content="The controlled records of Gujarat Print Pack Publications Pvt Ltd — filled, reviewed, verified and kept on file." />
    <!-- The company's mark in the tab, the bookmark and a phone's home screen
         (REQUIREMENTS §65). Relative addresses, like the stylesheet below: the
         files are frontend/public/brand/*, served at the site root in dev and
         copied beside index.html by the build. -->
    <meta name="theme-color" content="#7e3c40" />
    <link rel="icon" href="brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="brand/logo-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="brand/logo-192.png" />
    <link rel="apple-touch-icon" href="brand/logo-192.png" />
    <!-- REQUIREMENTS §90: the theme this computer showed last (light, dark or the same
         as the computer), on <html> BEFORE the stylesheet is read, so the first paint is
         already in it and the page never flashes the other one. The app then paints the
         signed-in person's own (store/theme.tsx). Nothing chosen yet: light. The server
         sends no Content-Security-Policy, so an inline script runs; should one ever be
         added, give this a nonce or move it to a blocking script file. The tab colour
         (theme-color above) is the company's burgundy in every theme. -->
    <script>(function(){try{var t=localStorage.getItem("dcrs:theme");if(t==="light"||t==="dark"||t==="system"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
    <link rel="stylesheet" href="assets/styles.css" />
    <!-- REQUIREMENTS §81: each feature's own rules (fonts and the intro, uploading an
         edited file, sound and voice, celebrations), after the main stylesheet. -->
    <link rel="stylesheet" href="styles/brand.css" />
    <link rel="stylesheet" href="styles/roundtrip.css" />
    <link rel="stylesheet" href="styles/voice.css" />
    <link rel="stylesheet" href="styles/motivation.css" />
    <!-- REQUIREMENTS §85: the guided tour of the whole software, over the Dashboard. -->
    <link rel="stylesheet" href="styles/tour.css" />
    <!-- REQUIREMENTS §84: small, quick movement across the app (screen only, never
         under reduced motion), last so it is read after every rule it adds to. -->
    <link rel="stylesheet" href="styles/delight.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="assets/app.js"></script>
  </body>
</html>
